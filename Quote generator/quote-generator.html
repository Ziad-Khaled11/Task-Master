<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator Toast Notification</title>
    <link rel="stylesheet" href="quote-generator.css">
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Function to fetch a random quote from API Ninjas API
        async function fetchQuote() {
            const url = 'https://api.api-ninjas.com/v1/quotes';
            const options = {
                method: 'GET',
                headers: {
                    'X-Api-Key': '1CtP7gVKmOMOtJ1w2Jzu0A==6MuVCMhKytWgPQBP',
                    'Content-Type': 'application/json'
                }
            };

            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error('Failed to fetch quote');
                const data = await response.json();
                // Adjust based on the response structure from API Ninjas
                return `${data[0].quote} — ${data[0].author}`;
            } catch (error) {
                console.error('Error fetching quote:', error);
                return 'An error occurred while fetching a quote.';
            }
        }

        // Function to show a toast notification with the fetched quote
        async function showToast() {
            const toastContainer = document.getElementById('toastContainer');
            const quote = await fetchQuote();

            // Create a new toast element
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = quote;

            // Append the toast to the container
            toastContainer.appendChild(toast);

            // Show the toast with animation
            setTimeout(() => {
                toast.classList.add('show');
            }, 100); // Delay to trigger CSS transition

            // Remove the toast after 30 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove(); // Remove the toast from DOM
                }, 500); // Delay for transition out
            }, 4000);
        }

        // Show the first toast immediately and set interval for subsequent toasts
        showToast();
        setInterval(showToast, 15 * 60 * 100); // Show a new toast every 15 minutes
    </script>
</body>
</html>
