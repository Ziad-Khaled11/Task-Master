<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
    <link rel="icon" href="../resources/icons/User.png" type="image/x-icon">
    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
</head>
<body class="container-fluid">
    <div class="row min-vh-100">
        <!-- Side Panel -->
        <div class="col-md-3 p-0">
            <iframe src="../side pannel/side-pannel.html" class="h-100 w-100" name="contentFrame"></iframe>
        </div>

        <!-- Main Content -->
        <div class="col-md-6 d-flex align-items-center justify-content-center" style="color: #8e8e8e;">
            <div class="card p-4 shadow-lg" style="width: 90%; max-width: 600px;">
                <div class="row g-4">
                    <!-- Profile Picture Section -->
                    <div class="col-1 text-center" style="margin-top: 30px; transform: translateX(105%) translateY(-20%);">
                        <div class="position-relative mx-auto" style="width: 150px;">
                            <div class="circle">
                                <img src="../resources/icons/profile.png" 
                                     class="img-fluid rounded-circle"
                                     id="profile-pic"
                                     style="width: 350px; height: px; object-fit: cover;">
                                <input type="file" 
                                       accept="image/jpeg, image/png, image/jpg" 
                                       id="input-file" 
                                       class="form-control d-none">
                                <label for="input-file" 
                                       class="btn btn-link text-decoration-none position-absolute " style="transform: translateY(150%);  color: rgba(6, 16, 55, 1); font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; ">
                                    Update image
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Form Section -->
                    <div class="col-12">
                        <form>
                            <!-- Name Input -->
                            <div class="mb-4 input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <ion-icon name="person"></ion-icon>
                                </span>
                                <input type="text" class="form-control" required>
                                <label class="form-label position-absolute ms-5">Name</label>
                            </div>

                            <!-- Phone Input -->
                            <div class="mb-4 input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <ion-icon name="call"></ion-icon>
                                </span>
                                <input type="tel" class="form-control" required>
                                <label class="form-label position-absolute ms-5">Phone</label>
                            </div>

                            <!-- Email Input -->
                            <div class="mb-4 input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <ion-icon name="mail"></ion-icon>
                                </span>
                                <input type="email" class="form-control" required>
                                <label class="form-label position-absolute ms-5">Email</label>
                            </div>

                            <!-- Password Input -->
                            <div class="mb-4 input-group">
                                <span class="input-group-text bg-transparent border-end-0">
                                    <ion-icon name="lock-closed"></ion-icon>
                                </span>
                                <input type="password" id="password" class="form-control" required>
                                <label class="form-label position-absolute ms-5">Password</label>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
                                    <ion-icon name="eye-off-outline" id="eyeIcon"></ion-icon>
                                </button>
                            </div>

                            <div class="d-grid" style="  background-color: rgba(6, 16, 55, 1);; /* Light gray background */">
                                <button type="submit" class="btn btn-primary" style="background-color: rgba(6, 16, 55, 1); border-color: rgba(6, 16, 55, 1); color: white;">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quote Generator -->
        <div class="col-md-3 p-0">
            <iframe src="../Quote generator/quote-generator.html" class="h-100 w-100"></iframe>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="profile.js"></script>
</body>
</html>
